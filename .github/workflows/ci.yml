name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-runtime.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline Python tests
        run: python -m pytest -q

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for showcase export
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export validated showcase assets
        run: PYTHONPATH=src python -m demo.export_showcase

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build static showcase frontend
        working-directory: frontend
        env:
          VITE_DEMO_MODE: static
          VITE_BASE_PATH: /
        run: npm run build:static

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t financial-research-agent-api:ci .

      - name: Record Docker image size
        run: docker image inspect financial-research-agent-api:ci --format 'image_size_bytes={{.Size}}'

      - name: Verify CPU-only PyTorch
        run: |
          docker run --rm -i financial-research-agent-api:ci python - <<'PY'
          import importlib.metadata

          import torch

          print("torch_version={}".format(torch.__version__))
          print("torch_cuda={}".format(torch.version.cuda))
          print("torch_cuda_available={}".format(torch.cuda.is_available()))

          assert torch.version.cuda is None
          assert not torch.cuda.is_available()

          forbidden_prefixes = (
              "nvidia-",
              "nvidia_",
              "cuda-",
              "cuda_",
              "cudnn-",
              "cudnn_",
              "nccl-",
              "nccl_",
          )
          installed_packages = [
              distribution.metadata["Name"].lower()
              for distribution in importlib.metadata.distributions()
              if distribution.metadata.get("Name")
          ]
          unexpected_gpu_packages = sorted(
              package
              for package in installed_packages
              if package.startswith(forbidden_prefixes) or package == "triton"
          )
          print("unexpected_gpu_packages={}".format(unexpected_gpu_packages))
          assert not unexpected_gpu_packages
          PY

      - name: Smoke test showcase-only container
        shell: bash
        run: |
          container_name=financial-research-agent-ci

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Container status:"
              docker ps -a --filter "name=${container_name}"
              echo "Container logs:"
              docker logs "$container_name" || true
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -p 8000:8080 \
            -e PORT=8080 \
            -e DEMO_LIVE_ENABLED=false \
            financial-research-agent-api:ci

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://localhost:8000/healthz; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Container did not become healthy within 40 seconds."
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://localhost:8000/v1/showcase/scenarios \
            --output /tmp/showcase-scenarios.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          scenarios = json.loads(Path("/tmp/showcase-scenarios.json").read_text())["scenarios"]
          assert len(scenarios) == 6, "Expected six reviewed showcase scenarios."
          print("showcase_scenario_count={}".format(len(scenarios)))
          PY
